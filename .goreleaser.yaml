version: 2

builds:
  - id: macos #build:macos
    goos: [darwin]
    goarch: [amd64, arm64]

  - id: linux #build:linux
    goos: [linux]
    goarch: [amd64, arm64]

  - id: windows #build:windows
    goos: [windows]
    goarch: [amd64, arm64]

archives:
  - id: linux-archive
    ids: [linux]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_cli_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: macos-archive
    ids: [macos]
    formats: [zip]
    name_template: "{{ .ProjectName }}_cli_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: windows-archive
    ids: [windows]
    formats: [zip]
    name_template: "{{ .ProjectName }}_cli_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

homebrew_casks:
  - name: tablepilot
    repository:
      owner: Yiling-J
      name: homebrew-tablepilot
    homepage: https://github.com/Yiling-J/tablepilot
    conflicts:
      - formula: tablepilot
    commit_author:
      name: Yiling-J
    skip_upload: auto
